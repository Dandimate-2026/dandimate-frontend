name: Continuous Deployment

# feature/develop에 머지되면 빌드해서 백엔드 서버(https://43-201-73-60.sslip.io)의 프론트 폴더에 바로 올린다.
# 손으로 dist.zip을 넘기지 않기 위한 배포다.
on:
  push:
    branches: ["feature/develop", "main"]
  # GitHub Actions 화면에서 버튼으로 다시 배포할 수 있게 둔다
  workflow_dispatch:

# 연달아 머지돼도 배포가 겹치지 않게, 마지막 것만 끝까지 돈다
concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # 서버에서 nginx가 프론트(/)로 보여주는 폴더. 백엔드가 알려준 경로를 저장소 변수 FRONTEND_DIR에 넣는다
      FRONTEND_DIR: ${{ vars.FRONTEND_DIR || '/home/ubuntu/dandimate-frontend/dist' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # 빌드가 실패하면 여기서 멈추고 서버에는 아무것도 올리지 않는다
      - name: Install dependencies and build
        env:
          # 토스 테스트 결제 클라이언트 키 (공개 키라 저장소 변수에 둔다). 비어 있으면 결제 화면 시연 모드로 빌드된다
          VITE_TOSS_CLIENT_KEY: ${{ vars.VITE_TOSS_CLIENT_KEY }}
        run: |
          npm ci
          npm run build

      - name: Copy build files
        uses: appleboy/scp-action@v0.1.6
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          key: ${{ secrets.SERVER_KEY }}
          source: dist/*
          # dist/ 폴더 이름은 빼고 안의 파일만 FRONTEND_DIR에 넣는다
          strip_components: 1
          # 지난 빌드의 오래된 파일이 남지 않게 폴더를 비우고 새로 넣는다
          rm: true
          target: ${{ env.FRONTEND_DIR }}

      - name: Reload nginx
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          key: ${{ secrets.SERVER_KEY }}
          # 정적 파일만 바뀌어서 재시작 대신 설정만 다시 읽게 한다
          script: |
            sudo nginx -t && sudo systemctl reload nginx
